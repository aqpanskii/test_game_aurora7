<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Авария на «Авроре-7»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#02050b;--panel:rgba(7,15,28,.84);--panel2:rgba(14,28,48,.78);--ink:#e6f2ff;--muted:#8fa8c4;--line:rgba(120,185,255,.20);
  --good:#3fe6b0;--bad:#ff5a6e;--warn:#ffbf5a;--cyan:#5fe7ff;--shadow:0 10px 34px rgba(0,0,0,.55);--scan:rgba(120,190,255,.05);
  --btnink:#03121c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Exo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;font-size:16px;line-height:1.45}
.mono,.coord,.lv,.g-val{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.wrap{max-width:940px;margin:0 auto;padding:14px 14px 40px}
h1,h2,h3,h4{font-family:'Exo 2',system-ui,sans-serif;margin:0}
button{font:inherit;font-weight:700;cursor:pointer;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;transition:border-color .12s,transform .06s}
button:hover{border-color:var(--ac,#4da3ff)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac,#4da3ff);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed}
input{font:inherit;font-weight:500;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.big{display:block;width:100%;padding:16px;font-size:18px;font-weight:800;letter-spacing:.06em;background:var(--ac,#4da3ff);color:var(--btnink);border:0;border-radius:12px;text-transform:uppercase}
.big:hover{filter:brightness(1.08)}
.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 14px}
.hint.sm{font-size:13px;margin:12px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px}

.hazard{height:10px;border-radius:6px;background:repeating-linear-gradient(-45deg,#f2b705 0 14px,#16181d 14px 28px);margin-bottom:22px}
.hero h1{font-size:clamp(30px,7vw,52px);font-weight:800;line-height:1.05;letter-spacing:-.01em}
.hero p{max-width:60ch;color:var(--muted);margin:14px 0 22px;font-size:17px}
.stack{display:grid;gap:14px}
label{display:block;font-size:14px;color:var(--muted);font-weight:700}
label input{margin-top:6px;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.err{color:var(--bad);font-weight:700;margin:0 0 12px}
details{margin-top:14px;padding:14px 18px}
summary{cursor:pointer;font-weight:800}
details ol{margin:10px 0 0;padding-left:20px;color:var(--muted)}
details li{margin:6px 0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.rolecard{--ac:#4da3ff;display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel)}
.rolecard .ic{font-size:30px}
.rolecard b{font-size:20px;color:var(--ac)}
.rolecard small{color:var(--muted);font-size:13px}
.rolecard em{font-style:normal;font-size:14px;margin-top:6px;color:var(--muted)}
.rolecard.taken em{color:var(--ink)}
.rolecard:disabled{opacity:1;cursor:default}
.rolecard.mine{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
.code{font-family:'JetBrains Mono',monospace;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 10px;letter-spacing:.12em}
.lobby-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hud[hidden]{display:none}
.hud-in{max-width:940px;margin:0 auto;padding:8px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.pips{display:flex;gap:6px}
.pip{width:26px;height:8px;border-radius:4px;background:var(--line)}
.pip.done{background:var(--good)}
.pip.cur{background:var(--warn);animation:blink 1.2s infinite}
.hud small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.timer{font:800 36px/1 'JetBrains Mono',monospace;letter-spacing:.02em;text-align:center}
.timer.low{color:var(--bad);animation:blink .8s infinite}
.hr{text-align:right}
.hull{display:inline-flex;gap:4px}
.hull i{width:16px;height:22px;border-radius:4px;background:var(--good);display:block}
.hull i.off{background:var(--line)}
.hud.shake{animation:shake .4s}
@keyframes blink{50%{opacity:.45}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.pip.cur,.timer.low,.hud.shake{animation:none}}

.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{--ac:#4da3ff;flex:1;min-width:120px}
.tabs button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--panel))}
.banner{padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--warn) 18%,var(--panel));border:1px solid var(--warn);margin-bottom:12px;font-weight:700}
.room{--ac:#4da3ff;border:1px solid var(--line);border-top:5px solid var(--ac);border-radius:14px;background-color:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.room.eng{background-image:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 4px)}
.room.nav{background-image:linear-gradient(var(--scan) 1px,transparent 1px),linear-gradient(90deg,var(--scan) 1px,transparent 1px);background-size:28px 28px}
.room.rad{background-image:repeating-linear-gradient(100deg,var(--scan) 0 2px,transparent 2px 14px)}
.room-h{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.room-h .ic{font-size:32px}
.rn{font-size:20px;font-weight:800;color:var(--ac);line-height:1.1}
.rr{font-size:14px;color:var(--muted)}
.mod{padding:10px 16px;font-size:14px;color:var(--muted);border-bottom:1px dashed var(--line)}
.mod b{color:var(--ink)}
.body{padding:16px}
h4{font-size:16px;margin:0 0 8px;color:var(--ac)}

.gauges{display:flex;gap:14px;justify-content:space-around;flex-wrap:wrap}
.gauge{text-align:center;width:74px}
.g-bar{height:150px;border:2px solid var(--line);border-radius:10px;position:relative;overflow:hidden;background:var(--panel2)}
.g-bar i{position:absolute;bottom:0;left:0;right:0;opacity:.88}
.g-val{font-size:34px;font-weight:700;margin-top:6px}
.g-n{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:12px}
.tbl td,.tbl th{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl td:nth-child(2){color:var(--muted);width:24px;text-align:center}
.mkr{cursor:pointer}
.mkr.mk{opacity:.38;text-decoration:line-through}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:8px}
.lamp{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:var(--panel2)}
.lamp .dot{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.levers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.lever{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.lever button{width:100%;padding:8px 0}
.lv{font-size:34px;font-weight:700}
.ln{font-size:13px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.chip{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;padding:8px 14px;border-radius:10px;border:2px solid var(--bad);color:var(--bad)}
.maze{display:block;width:100%;max-width:420px;margin:0 auto}
.maze text{fill:var(--muted);font:700 12px 'JetBrains Mono',monospace;pointer-events:none}
.maze line{stroke:var(--ink);stroke-width:4;stroke-linecap:round;pointer-events:none}
.maze .star{fill:#ffb13d;font-size:30px}
.maze .bg{fill:var(--panel2);stroke:none}
.maze .cm{fill:transparent;cursor:pointer}
.maze .cm.on{fill:color-mix(in srgb,var(--ac) 38%,transparent)}
.dpad{display:grid;grid-template-columns:repeat(3,minmax(0,92px));grid-template-rows:repeat(3,76px);gap:8px;justify-content:center;margin:6px 0 14px}
.dpad button{display:grid;place-items:center;line-height:1.1;padding:4px}
.dpad button span{font-size:26px}
.dpad button small{font-size:12px;color:var(--muted)}
.mvlog{text-align:center;color:var(--muted);min-height:24px}
.pos{font:700 64px/1 'JetBrains Mono',monospace;text-align:center;color:var(--ac);padding:22px 0;border:2px dashed var(--ac);border-radius:14px;margin-bottom:14px}
.bigword{font-size:clamp(34px,9vw,52px);font-weight:800;text-align:center;padding:30px 10px;border:2px dashed var(--ac);border-radius:14px;letter-spacing:.04em;margin-bottom:12px}
.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.codes button{padding:20px 10px;font-size:20px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.clue{padding:16px;border:2px dashed var(--ac);border-radius:14px;margin-bottom:16px;font-size:20px;line-height:1.35}
.clue small{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.slot{height:60px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);font:700 24px 'JetBrains Mono',monospace;color:var(--muted)}
.slot.on{border-color:var(--good);color:var(--ink);background:color-mix(in srgb,var(--good) 18%,var(--panel))}
.launch{font-size:22px;padding:22px}
.wires{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.wire{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 2px}
.wire i{display:block;width:12px;height:110px;border-radius:6px;background:var(--w)}
.wire.cut i{height:34px;opacity:.3}
.wire small{color:var(--muted);font-size:12px}
.fault{font:700 56px/1 'JetBrains Mono',monospace;text-align:center;padding:26px 8px;border:2px dashed var(--ac);border-radius:14px;color:var(--ac);margin-bottom:12px}
.dial{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.dial .dv{font:700 64px/1 'JetBrains Mono',monospace;min-width:76px;text-align:center}
.dial button{width:66px;height:66px;font-size:26px}
.note{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:12px}
.note b.mono{font-size:22px}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:320px;margin:0 auto 14px}
.sg button,.sg div{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;border:2px solid var(--line);background:var(--panel2);font-size:22px;padding:0}
.sg .on{background:color-mix(in srgb,var(--ac) 35%,var(--panel));border-color:var(--ac)}
.alpha{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:12px}
.alpha div{text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:700}
.alpha div.mk{opacity:.38}
.alpha small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.wordin{font:700 28px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;text-align:center;margin-bottom:12px}

/* ---------- Космос и корабль ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body::before{opacity:.9}
}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;
  background-image:
   radial-gradient(1.2px 1.2px at 12% 18%,#cfe0ff,transparent 60%),
   radial-gradient(1px 1px at 38% 72%,#ffffff,transparent 60%),
   radial-gradient(1.4px 1.4px at 67% 31%,#b9d2ff,transparent 60%),
   radial-gradient(1px 1px at 84% 84%,#ffffff,transparent 60%),
   radial-gradient(1.1px 1.1px at 53% 8%,#d7e4ff,transparent 60%),
   radial-gradient(900px 500px at 85% -5%,rgba(77,163,255,.10),transparent 70%),
   radial-gradient(700px 420px at 5% 105%,rgba(197,139,255,.09),transparent 70%);
  background-size:260px 260px,330px 330px,410px 410px,290px 290px,370px 370px,auto,auto;
  animation:drift 160s linear infinite}
:root[data-theme="dark"] body::before{opacity:.9}
@keyframes drift{to{background-position:-520px 260px,-660px 330px,-820px 410px,-580px 290px,-740px 370px,0 0,0 0}}
.scene{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;box-shadow:var(--shadow);line-height:0;background:#050a16}
.scene svg{display:block;width:100%;height:auto;max-height:210px}
.scene.alert{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad),0 0 26px rgba(255,84,104,.45)}
.scene.mini{margin:0 0 16px;box-shadow:none}
.scene.mini svg{max-height:130px}
body.alert::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:30;box-shadow:inset 0 0 130px rgba(255,60,80,.38);animation:blink 1s infinite}
.tw{animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.2}}
.ship{animation:float 5s ease-in-out infinite}
.ship.lose{animation:drift2 4s ease-out forwards}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes drift2{to{transform:translate(22px,16px) rotate(12deg)}}
.flame{transform-origin:116px 95px;animation:flick .18s infinite alternate}
@keyframes flick{from{transform:scaleX(.8)}to{transform:scaleX(1.12)}}
.pulse{animation:pulse 1.6s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.28);opacity:.75}}
.spark{animation:blink .8s infinite}
.beacon{animation:blink .55s infinite}
.sg2{animation:sgn 2s infinite;opacity:0}
.sg2.b{animation-delay:.5s}.sg2.c{animation-delay:1s}
@keyframes sgn{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.speed{animation:spd .7s linear infinite}
@keyframes spd{from{transform:translateX(0)}to{transform:translateX(-640px)}}
.expl circle{animation:boom 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.expl circle:nth-child(2){animation-delay:.35s}.expl circle:nth-child(3){animation-delay:.7s}
@keyframes boom{0%{transform:scale(.2);opacity:.95}100%{transform:scale(2.6);opacity:0}}
.deco{margin-left:auto;color:var(--ac);line-height:0;flex:none}
.deco svg{display:block}
.needle{transform-origin:45px 40px;animation:needle 3s ease-in-out infinite alternate}
@keyframes needle{from{transform:rotate(-55deg)}to{transform:rotate(45deg)}}
.sweep{transform-origin:45px 22px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar .9s ease-in-out infinite alternate}
@keyframes bar{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.mod{display:flex;align-items:center;gap:12px}
.mi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--panel2);border:1px solid var(--ac);box-shadow:0 0 12px color-mix(in srgb,var(--ac) 40%,transparent);flex:none}
@media (max-width:560px){.deco{display:none}}
@media (prefers-reduced-motion:reduce){
  .tw,.ship,.flame,.pulse,.spark,.beacon,.sg2,.speed,.expl circle,.needle,.sweep,.bar,body::before,body.alert::after{animation:none!important}
  .sg2{opacity:.6}
}

#ov{position:fixed;inset:0;background:rgba(3,7,13,.8);display:grid;place-items:center;z-index:50;padding:20px}
#ov[hidden]{display:none}
#ov .box{max-width:460px;width:100%;padding:28px;text-align:center}
#ov h2{font-size:34px;font-weight:800;margin-bottom:10px}
#ov p{color:var(--muted);margin:0 0 18px}
#ov .st{display:flex;justify-content:center;gap:24px;margin-bottom:20px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);z-index:40;max-width:min(92vw,520px);padding:10px 18px;border-radius:12px;font-weight:800;background:var(--panel);border:2px solid var(--line);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
#toast.ok{border-color:var(--good)}
#toast.bad{border-color:var(--bad)}
#chat{margin-top:16px;padding:12px 14px}
#chat[hidden]{display:none}
#clog{max-height:160px;overflow-y:auto;font-size:14px;margin-bottom:10px;display:grid;gap:4px}
#clog p{margin:0}
#clog .me b{color:var(--good)}
#clog .none{color:var(--muted)}
.cin{display:flex;gap:8px}
@media (max-width:560px){
  .two{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .rolecard{padding:12px}
  .timer{font-size:30px}
  .hud-in{padding:8px 10px}
  .pip{width:16px}
  .alpha{grid-template-columns:repeat(7,1fr)}
}
/* ===== ТЕМА: глубокий космос (галактика + угловой линкор) ===== */
body{background:var(--bg);letter-spacing:.01em}
body::before{display:none}
#space{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden;background:radial-gradient(120% 90% at 68% 28%,#071433 0%,#030a1d 46%,#010309 100%)}
#galwrap{position:absolute;width:max(1100px,150vw);aspect-ratio:1;left:60%;top:26%;transform:translate(-50%,-50%) rotate(-32deg) scale(1,.5);opacity:.85}
#gal{width:100%;height:100%;display:block;animation:gspin 900s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
#stars{position:absolute;inset:0;width:100%;height:100%}
#vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,transparent 38%,rgba(0,0,0,.62) 100%)}
@media (max-width:700px){#galwrap{left:55%;top:20%;width:210vw}}

.hazard{height:2px;border-radius:0;background:linear-gradient(90deg,transparent,var(--cyan) 20%,var(--cyan) 80%,transparent);box-shadow:0 0 14px var(--cyan);margin-bottom:22px}
.hero h1{text-transform:uppercase;letter-spacing:.06em;background:linear-gradient(180deg,#ffffff 10%,#a8dcff 65%,#5fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(95,200,255,.35))}
.hero p{color:#9fb6d0}

.card,.room,#ov .box,#chat{background:var(--panel);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:0;border-radius:0;
  box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(170,225,255,.16);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.room{position:relative;border-top:0}
.room::before{content:'';position:absolute;left:16px;right:0;top:0;height:3px;z-index:2;background:linear-gradient(90deg,var(--ac),transparent 88%);box-shadow:0 0 16px var(--ac)}
.room-h{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 20%,transparent),transparent 72%);border-bottom:1px solid var(--line)}
.rn{text-transform:uppercase;letter-spacing:.08em}
.mod{border-bottom:1px dashed rgba(120,185,255,.22)}

button{background:linear-gradient(180deg,rgba(28,52,84,.92),rgba(11,22,40,.92));border:1px solid var(--line);border-radius:3px;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
button:hover{border-color:var(--ac,var(--cyan));box-shadow:inset 0 0 16px color-mix(in srgb,var(--ac,var(--cyan)) 45%,transparent)}
.big{border:0;color:var(--btnink);background:linear-gradient(180deg,color-mix(in srgb,var(--ac,var(--cyan)) 55%,#ffffff),var(--ac,var(--cyan)));
  border-radius:3px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.big:hover{filter:brightness(1.12);box-shadow:inset 0 0 22px rgba(255,255,255,.4)}
input{background:rgba(3,9,18,.85);border:1px solid var(--line);border-radius:3px}

<body>
<div id="space"><div id="galwrap"><canvas id="gal" width="1000" height="1000"></canvas></div><canvas id="stars"></canvas></div>

    <div class="cin"><input id="cin" maxlength="140" placeholder="Текстовый чат — лучше говорить голосом, но можно и так" aria-label="Сообщение"><button id="csend">Отправить</button></div>
  </div>

<script>
(function(){
'use strict';

/* ======================================================================
   Константы
   ====================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

const ROLES={
  eng:{n:'Инженер', g:'Инженера', room:'Машинное отделение',ic:'🛠',c:'#ff9d3d'},
  nav:{n:'Штурман', g:'Штурмана', room:'Мостик',            ic:'🧭',c:'#4da3ff'},
  rad:{n:'Радист',  g:'Радиста',  room:'Радиорубка',        ic:'📡',c:'#c58bff'}
};
const RK=['eng','nav','rad'];
const TNAME={reactor:'Охлаждение реактора',maze:'Минное поле',protocol:'Протокол связи',wires:'Аварийные провода',
  dials:'Калибровка приборов',grid:'Звёздная карта',cipher:'Шифровка',launch:'Синхронный запуск'};
const POOL=['reactor','maze','protocol','wires','dials','grid','cipher'];
const ORDW=['первым','вторым','третьим'];
const ORDN=['первый','второй','третий','четвёртый','пятый','шестой'];
const DIRS={n:[0,-1,'s'],e:[1,0,'w'],s:[0,1,'n'],w:[-1,0,'e']};
const START_TIME=840;
const ALPHA='АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ';
const WC=[{n:'красный',c:'#ff5468'},{n:'синий',c:'#4da3ff'},{n:'жёлтый',c:'#ffd24d'},{n:'зелёный',c:'#4dff9a'},{n:'белый',c:'#e8eef7'}];

/* ======================================================================
   Генерация миссии из seed. У всех игроков данные одинаковы,
   но каждый видит только свою часть.
   ====================================================================== */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function allPerms(a){if(a.length<=1)return[a.slice()];const out=[];a.forEach((x,i)=>{allPerms(a.filter((_,j)=>j!==i)).forEach(p=>out.push([x].concat(p)));});return out;}
function sat(o,c){const i=x=>o.indexOf(x);switch(c.t){case'pos':return i(c.a)===c.k;case'npos':return i(c.a)!==c.k;case'bef':return i(c.a)<i(c.b);case'next':return i(c.b)===i(c.a)+1;}return false;}
function coord(x,y){return String.fromCharCode(65+x)+(y+1);}
function pop(n){let c=0;while(n){c+=n&1;n>>>=1;}return c;}
function rotCW(bits){let o=0;for(let i=0;i<25;i++){if(bits&(1<<i)){const r=Math.floor(i/5),c=i%5;o|=1<<(c*5+(4-r));}}return o;}
function reach(open,start,exit,mset,W,H){
  const seen=new Set([start.join(',')]),q=[start];
  while(q.length){
    const [x,y]=q.shift();
    if(x===exit[0]&&y===exit[1])return true;
    for(const d in DIRS){
      if(!open[y][x][d])continue;
      const nx=x+DIRS[d][0],ny=y+DIRS[d][1],k=nx+','+ny;
      if(nx<0||ny<0||nx>=W||ny>=H||seen.has(k)||mset.has(k))continue;
      seen.add(k);q.push([nx,ny]);
    }
  }
  return false;
}

const GEN={
  reactor(r){
    const levNames=['ДЕЛЬТА','СИГМА','ОМЕГА','ТЕТА'];
    const colors=[{n:'красный',c:'#ff5468'},{n:'синий',c:'#4da3ff'},{n:'жёлтый',c:'#ffd24d'},{n:'зелёный',c:'#4dff9a'}];
    const mapped=shuffle(levNames,r),target=colors.map(()=>Math.floor(r()*10));
    const lamps=[{n:'ПОКОЙ',c:'#4dffa8',d:0,rule:'значения остаются как есть'},{n:'НАГРУЗКА',c:'#ffd24d',d:2,rule:'к каждому значению прибавить 2 (после 9 идёт 0)'},{n:'ФОРСАЖ',c:'#ff5468',d:-3,rule:'из каждого значения вычесть 3 (после 0 идёт 9)'}];
    const lamp=Math.floor(r()*3),answer={};
    colors.forEach((c,i)=>{answer[mapped[i]]=(((target[i]+lamps[lamp].d)%10)+10)%10;});
    return{colors,mapped,target,lamps,lamp,panelOrder:shuffle(levNames,r),answer};
  },
  maze(r){
    const W=6,H=6,open=[];
    for(let y=0;y<H;y++){open.push([]);for(let x=0;x<W;x++)open[y].push({n:0,e:0,s:0,w:0});}
    const seen=[];for(let y=0;y<H;y++)seen.push(Array(W).fill(false));
    const stack=[[0,0]];seen[0][0]=true;
    while(stack.length){
      const [x,y]=stack[stack.length-1];
      const nb=shuffle(Object.keys(DIRS),r).filter(d=>{const nx=x+DIRS[d][0],ny=y+DIRS[d][1];return nx>=0&&ny>=0&&nx<W&&ny<H&&!seen[ny][nx];});
      if(!nb.length){stack.pop();continue;}
      const d=nb[0],nx=x+DIRS[d][0],ny=y+DIRS[d][1];
      open[y][x][d]=1;open[ny][nx][DIRS[d][2]]=1;seen[ny][nx]=true;stack.push([nx,ny]);
    }
    for(let i=0;i<8;i++){
      const x=Math.floor(r()*W),y=Math.floor(r()*H),d=['n','e','s','w'][Math.floor(r()*4)];
      const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      open[y][x][d]=1;open[ny][nx][DIRS[d][2]]=1;
    }
    const sx=r()<.5?0:W-1,sy=r()<.5?0:H-1,start=[sx,sy],exit=[W-1-sx,H-1-sy];
    let mines=[],mset=new Set();
    const cells=[];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      if(x===sx&&y===sy)continue;if(x===exit[0]&&y===exit[1])continue;cells.push([x,y]);
    }
    for(let cnt=5;cnt>=1&&!mines.length;cnt--){
      for(let t=0;t<150;t++){
        const m=shuffle(cells,r).slice(0,cnt),set=new Set(m.map(c=>c.join(',')));
        if(reach(open,start,exit,set,W,H)){mines=m;mset=set;break;}
      }
    }
    return{W,H,open,start,exit,mines,mset};
  },
  protocol(r){
    const sigs=['ВЕГА','ОРИОН','НОВА','ПУЛЬСАР','КВАЗАР','ЗЕНИТ','АТЛАС','ТИТАН'];
    const codes=['ЛЁД','ЖАР','ТЬМА','ВОЛНА','ИСКРА','ПЫЛЬ','ГРОМ','ТУМАН'];
    const tA=shuffle(codes,r);let tB=shuffle(codes,r);
    for(let t=0;t<60&&tB.some((w,i)=>w===tA[i]);t++)tB=shuffle(codes,r);
    if(tB.some((w,i)=>w===tA[i]))tB=tA.slice(1).concat(tA[0]);
    const ids=shuffle([0,1,2,3,4,5,6,7],r).slice(0,3);
    const rounds=ids.map(i=>{
      const mode=r()<.5?0:1,ans=mode?tB[i]:tA[i],other=mode?tA[i]:tB[i];
      const rest=shuffle(codes.filter(w=>w!==ans&&w!==other),r).slice(0,4);
      return{i,sig:sigs[i],mode,ans,btns:shuffle([ans,other].concat(rest),r)};
    });
    return{sigs,tA,tB,rounds,modes:['АЛЬФА','БЕТА']};
  },
  wires(r){
    const cab=[];for(let i=0;i<6;i++)cab.push(Math.floor(r()*5));
    for(let t=0;t<50&&new Set(cab).size<3;t++)cab[Math.floor(r()*6)]=Math.floor(r()*5);
    const letters='БВГДЖКЛМНПРСТ',codes=[];
    while(codes.length<6){const c=letters[Math.floor(r()*letters.length)]+'-'+(1+Math.floor(r()*9));if(!codes.includes(c))codes.push(c);}
    const present=Array.from(new Set(cab));
    const entries=codes.map(code=>{
      const col=present[Math.floor(r()*present.length)],cnt=cab.filter(x=>x===col).length;
      return{code,col,k:1+Math.floor(r()*cnt)};
    });
    const e=entries[Math.floor(r()*6)];let seen=0,ans=-1;
    cab.forEach((c,i)=>{if(c===e.col){seen++;if(seen===e.k)ans=i;}});
    return{cab,entries,fault:e.code,ans};
  },
  dials(r){
    const ring=shuffle(RK,r),target={},offset={},need={};
    RK.forEach(ro=>{target[ro]=Math.floor(r()*10);offset[ro]=1+Math.floor(r()*9);need[ro]=(target[ro]+offset[ro])%10;});
    return{ring,target,offset,need};
  },
  grid(r){
    const n=6+Math.floor(r()*3),cells=shuffle(Array.from({length:25},(_,i)=>i),r).slice(0,n);
    let g=0;cells.forEach(i=>{g|=1<<i;});
    const rot=1+Math.floor(r()*3);let shown=g;for(let i=0;i<rot;i++)shown=rotCW(shown);
    return{n,g,rot,shown};
  },
  cipher(r){
    const words=['КОСМОС','РАКЕТА','ОРБИТА','МОТОР','ЗВЕЗДА','ПЛАНЕТА','СПУТНИК','ЛУНА','КОМЕТА','СКАФАНДР'];
    const word=words[Math.floor(r()*words.length)],s=2+Math.floor(r()*8);
    const cipher=word.split('').map(ch=>ALPHA[(ALPHA.indexOf(ch)+s)%ALPHA.length]).join('');
    return{word,s,cipher};
  },
  launch(r){
    const perm=shuffle(RK,r),pool=[];
    perm.forEach((a,i)=>{
      pool.push({t:'pos',a,k:i});
      for(let k=0;k<3;k++)if(k!==i)pool.push({t:'npos',a,k});
      perm.forEach((b,j)=>{if(j>i)pool.push({t:'bef',a,b});});
      if(i<2)pool.push({t:'next',a,b:perm[i+1]});
    });
    const perms=allPerms(RK);let clues=null;
    for(let t=0;t<4000&&!clues;t++){
      const pick=shuffle(pool,r).slice(0,3);
      if(perms.filter(o=>pick.every(c=>sat(o,c))).length===1)clues=pick;
    }
    if(!clues)clues=perm.map((a,i)=>({t:'pos',a,k:i}));
    const who=shuffle(RK,r),cl={};who.forEach((ro,i)=>{cl[ro]=clues[i];});
    return{perm,clues:cl};
  }
};

function gen(seed){
  const r=rng(seed),types=shuffle(POOL,r).slice(0,5).concat(['launch']);
  const levels=types.map(t=>{const sl=shuffle(RK,r);return{t,A:sl[0],B:sl[1],C:sl[2],d:GEN[t](r)};});
  return{seed,levels};
}
function initX(L){
  switch(L.t){
    case'maze':return{pos:L.d.start.slice(),mv:''};
    case'protocol':return{rnd:0};
    case'wires':return{cut:0};
    case'dials':return{dl:{eng:0,nav:0,rad:0}};
    case'grid':return{g:0};
    case'launch':return{ord:0};
  }
  return{};
}
function clueText(c){
  switch(c.t){
    case'pos':return ROLES[c.a].n+' нажимает <b>'+ORDW[c.k]+'</b>.';
    case'npos':return ROLES[c.a].n+' нажимает <b>не '+ORDW[c.k]+'</b>.';
    case'bef':return ROLES[c.a].n+' нажимает <b>раньше</b> '+ROLES[c.b].g+'.';
    case'next':return ROLES[c.b].n+' нажимает <b>сразу после</b> '+ROLES[c.a].g+'.';
  }
  return '';
}

/* ======================================================================
   Состояние
   ====================================================================== */
let mode='menu',solo=false,room=null,S=null,G=null,hosting=false,timer=null,endAt=0;
let myRole=null,myName='',code='',soloRole='eng',menuErr='';
let lev=[0,0,0,0],marks={},typed='',aSeq=0,aQ=[],lastN={},screen='',lastSig='',seenSeed=null,lastSt=-1,lastEv=0,lastPh='';
let lastScene='',cseq=0,cQ=[],chatSeen={},chatLog=[],toastT=null;

const hud=$('#hud'),main=$('#main'),ov=$('#ov'),chat=$('#chat');

let ac=null;
function beep(f,d,type){
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.value=.06;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.14));o.stop(ac.currentTime+(d||.14));
  }catch(e){}
}
function sfx(k){
  if(k==='ok'){beep(660,.12);setTimeout(()=>beep(880,.18),110);}
  else if(k==='bad'){beep(140,.35,'sawtooth');}
  else{beep(330,.08);}
}
function toast(t,k){
  const el=$('#toast');el.textContent=t;el.className='show '+(k||'');
  clearTimeout(toastT);toastT=setTimeout(()=>{el.className='';},3200);
}

/* ======================================================================
   Игровая логика (хост или одиночная тренировка)
   ====================================================================== */
function newState(seed){
  return{ph:'play',seed,st:0,v:1,left:START_TIME,hull:3,why:'',x:initX(G.levels[0]),ev:{n:0,k:'',t:''}};
}
function ev(k,t){S.ev={n:S.ev.n+1,k,t};}
function end(res,why){S.ph=res;S.why=why||'';clearInterval(timer);timer=null;}
function strike(t){
  S.hull--;endAt-=30000;ev('bad','💥 '+t+' · −30 с');
  if(S.hull<=0)end('lose','hull');
}
function advance(){
  const L=G.levels[S.st];
  if(S.st>=G.levels.length-1){ev('ok','🚀 Двигатели запущены!');end('win');return;}
  S.st++;S.x=initX(G.levels[S.st]);
  ev('ok','✔ Готово: '+TNAME[L.t]);
}
function applyAction(a,role){
  if(!S||S.ph!=='play'||!a||typeof a!=='object'||!ROLES[role])return;
  const L=G.levels[S.st],d=L.d,x=S.x,isA=role===L.A;
  switch(L.t+':'+a.k){
    case'reactor:apply':{
      if(!isA||!Array.isArray(a.d)||a.d.length!==4)return;
      let ok=0;d.panelOrder.forEach((n,i)=>{if(+a.d[i]===d.answer[n])ok++;});
      if(ok===4)advance();else strike('Реактор: верно '+ok+' из 4');
      break;
    }
    case'maze:mv':{
      if(!isA||typeof a.d!=='string'||a.d.length!==1||!(a.d in DIRS))return;
      const dr=a.d,px=x.pos[0],py=x.pos[1];
      if(!d.open[py][px][dr]){endAt-=3000;x.mv='🧱 Стена — путь закрыт';ev('info','🧱 Врезались в стену · −3 с');break;}
      const nx=px+DIRS[dr][0],ny=py+DIRS[dr][1];
      if(d.mset.has(nx+','+ny)){x.mv='💥 Впереди мина';strike('Подрыв на мине');break;}
      x.pos=[nx,ny];x.mv='Шаг выполнен';
      if(nx===d.exit[0]&&ny===d.exit[1])advance();
      break;
    }
    case'protocol:pick':{
      if(!isA||typeof a.w!=='string')return;
      if(a.w===d.rounds[x.rnd].ans){x.rnd++;if(x.rnd>=3)advance();else ev('ok','✔ Код принят');}
      else strike('Неверный код');
      break;
    }
    case'wires:cut':{
      if(!isA||!Number.isInteger(a.i)||a.i<0||a.i>5||(x.cut&(1<<a.i)))return;
      x.cut|=1<<a.i;
      if(a.i===d.ans)advance();else strike('Перерезан не тот провод');
      break;
    }
    case'dials:dial':{
      if(!Number.isInteger(a.v)||a.v<0||a.v>9)return;
      x.dl[role]=a.v;break;
    }
    case'dials:check':{
      let ok=0;RK.forEach(ro=>{if(x.dl[ro]===d.need[ro])ok++;});
      if(ok===3)advance();else strike('Калибровка: верно '+ok+' из 3');
      break;
    }
    case'grid:gt':{
      if(!isA||!Number.isInteger(a.i)||a.i<0||a.i>24)return;
      x.g^=1<<a.i;break;
    }
    case'grid:gok':{
      if(!isA)return;
      if(x.g===d.g)advance();else strike('Звёздная карта: ошибок в клетках — '+pop(x.g^d.g));
      break;
    }
    case'cipher:word':{
      if(!isA||typeof a.w!=='string')return;
      if(a.w.trim().toUpperCase().replace(/Ё/g,'Е')===d.word)advance();else strike('Слово расшифровано неверно');
      break;
    }
    case'launch:launch':{
      if(d.perm[x.ord]===role){x.ord++;if(x.ord>=3)advance();else ev('ok','🔑 Ключ принят ('+x.ord+'/3)');}
      else{x.ord=0;strike('Нарушен порядок запуска');}
      break;
    }
    default:return;
  }
  commit();
}
function commit(){
  if(!S)return;
  if(S.ph==='play'){
    S.left=Math.max(0,Math.ceil((endAt-Date.now())/1000));
    if(S.left<=0)end('lose','time');
  }
  S.v++;
  if(!solo&&room)room.presence({st:clone(S)}).catch(()=>{});
  render();
}
function tick(){
  if(!S||S.ph!=='play')return;
  const l=Math.max(0,Math.ceil((endAt-Date.now())/1000));
  if(l!==S.left)commit();
}
function startTimer(){clearInterval(timer);endAt=Date.now()+S.left*1000;timer=setInterval(tick,400);}
function startGame(){
  if(!solo&&!iAmCreator())return;
  const seed=(Math.random()*2147483647)|0;
  G=gen(seed);S=newState(seed);hosting=!solo;lev=[0,0,0,0];marks={};typed='';lastN={};
  startTimer();
  if(!solo&&room)room.presence({host:1,st:clone(S)}).catch(()=>{});
  render();
}
function backToLobby(){
  clearInterval(timer);timer=null;S=null;hosting=false;lastSig='';

/* ======================================================================
   Сеть: состояние публикует хост, остальные шлют действия
   ====================================================================== */
function byPeer(a,b){return a.peer<b.peer?-1:a.peer>b.peer?1:0;}
function viewers(){return room?room.peers().filter(p=>p.kind==='viewer'):[];}
function holders(){
  const m={};
  viewers().filter(p=>p.presence&&ROLES[p.presence.role]).sort(byPeer).forEach(p=>{if(!m[p.presence.role])m[p.presence.role]=p;});
  return m;
}
function creator(){
  const ps=viewers().filter(p=>p.presence&&typeof p.presence.jt==='number');
  ps.sort((a,b)=>a.presence.jt-b.presence.jt||byPeer(a,b));
  return ps[0]||null;
}
function iAmCreator(){const c=creator();return !!(c&&c.isMe);}
function okState(st){
  return st&&typeof st==='object'&&typeof st.ph==='string'&&typeof st.seed==='number'&&st.st>=0&&st.st<12&&
    st.x&&typeof st.x==='object'&&st.ev&&typeof st.ev==='object'&&typeof st.left==='number'&&typeof st.hull==='number';
}
function viewState(){
  if(S)return S;
  if(solo||!room)return null;
  const hs=viewers().filter(p=>p.presence&&p.presence.host&&okState(p.presence.st)).sort(byPeer);
  return hs.length?hs[0].presence.st:null;
}
function send(act){
  const role=solo?soloRole:myRole;
  if(!role)return;
  if(S){applyAction(act,role);return;}
  if(!room)return;
  aSeq++;aQ.push(Object.assign({n:aSeq},act));aQ=aQ.slice(-24);
  room.presence({a:aQ}).catch(()=>{});
}
function processActions(ps){
  const h=holders();
  ps.forEach(p=>{
    if(p.isMe||p.kind!=='viewer')return;
    const a=p.presence&&p.presence.a;if(!Array.isArray(a))return;
    const last=lastN[p.peer]||0;let mx=last;
    const role=p.presence.role;
    a.filter(x=>x&&typeof x.n==='number'&&x.n>last).sort((x,y)=>x.n-y.n).forEach(x=>{
      mx=Math.max(mx,x.n);
      if(ROLES[role]&&h[role]&&h[role].peer===p.peer)applyAction(x,role);
    });
    lastN[p.peer]=mx;
  });
}
function onPeers(){
  if(!room)return;
  const ps=room.peers();
  if(myRole){
    const h=holders()[myRole];
    if(h&&!h.isMe){myRole=null;room.presence({role:null}).catch(()=>{});toast('Эту роль уже занял другой игрок','bad');}
  }
  if(hosting){
    const me=ps.find(p=>p.isMe&&p.sameTab);
    const other=viewers().filter(p=>!p.isMe&&p.presence&&p.presence.host).sort(byPeer)[0];
    if(me&&other&&other.peer<me.peer){
      clearInterval(timer);S=null;hosting=false;lastSig='';
      room.presence({host:null,st:null}).catch(()=>{});
    }
  }
  if(hosting)processActions(ps);
  harvestChat(ps);
  render();
}
async function goOnline(){
  const nm=($('#iname').value||'').trim().slice(0,16)||'Курсант';
  const cd=($('#icode').value||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10);
  if(!cd){menuErr='Введите код комнаты (латинские буквы или цифры).';showMenu();return;}
  myName=nm;code=cd;menuErr='';
  main.innerHTML='<div class="card pad"><b>Подключаемся к комнате…</b></div>';
  try{
    const base=(window.claude&&window.claude.use)?await window.claude.use('room'):null;
    if(!base)throw new Error('no-room');
    room=await base.join('ship-'+cd);
  }catch(e){
    room=null;menuErr='Не удалось подключиться. Онлайн-режим работает, когда страница открыта в Claude и у игроков есть к ней доступ. Можно потренироваться в одиночку.';
    showMenu();return;
  }
  mode='online';solo=false;myRole=null;lastN={};chatSeen={};chatLog=[];
  room.onPeers(onPeers,()=>{toast('Соединение с комнатой потеряно','bad');});
  room.presence({name:myName,role:null,jt:(room.isHub&&room.isHub())?1:Date.now()}).catch(()=>{});
  chat.hidden=false;renderChat();
  render();
}
function leaveRoom(){
  if(room){room.leave().catch(()=>{});}
  room=null;mode='menu';myRole=null;hosting=false;S=null;clearInterval(timer);timer=null;
  screen='';lastSig='';chat.hidden=true;ov.hidden=true;hud.hidden=true;render();
}
function claim(r){
  if(!room||!ROLES[r])return;
  const h=holders()[r];if(h&&!h.isMe)return;
  myRole=(myRole===r)?null:r;
  room.presence({role:myRole}).catch(()=>{});
  lastSig='';render();
}

function sendChat(){
  const inp=$('#cin');const t=inp.value.trim().slice(0,140);
  if(!t||!room)return;
  cseq++;cQ.push({n:cseq,t});cQ=cQ.slice(-3);
  room.presence({c:cQ}).catch(()=>{});inp.value='';
}
function harvestChat(ps){
  let ch=false;
  ps.forEach(p=>{
    const c=p.presence&&p.presence.c;if(!Array.isArray(c))return;
    const seen=chatSeen[p.peer]||0;let mx=seen;
    c.forEach(m=>{
      if(m&&typeof m.n==='number'&&m.n>seen&&typeof m.t==='string'){
        chatLog.push({me:p.isMe,name:String(p.presence.name||'Игрок').slice(0,16),role:p.presence.role,t:m.t.slice(0,140)});
        mx=Math.max(mx,m.n);ch=true;
      }
    });
    chatSeen[p.peer]=mx;
  });
  if(ch){if(chatLog.length>60)chatLog.splice(0,chatLog.length-60);renderChat();}
}
function renderChat(){
  const el=$('#clog');if(!el)return;
  if(!chatLog.length){el.innerHTML='<p class="none">Здесь появятся сообщения игроков.</p>';return;}
  el.innerHTML=chatLog.map(m=>'<p class="'+(m.me?'me':'')+'"><b>'+(ROLES[m.role]?ROLES[m.role].ic+' ':'')+esc(m.name)+':</b> '+esc(m.t)+'</p>').join('');
  el.scrollTop=el.scrollHeight;
}

/* ----- Космос: галактика и звёзды (рисуется кодом) ----- */
function paintGalaxy(cv){
  const S=cv.width,c=cv.getContext('2d'),cx=S/2,cy=S/2,R=S*0.47,r=rng(42);
  c.clearRect(0,0,S,S);c.globalCompositeOperation='lighter';
  let gr=c.createRadialGradient(cx,cy,0,cx,cy,R);
  gr.addColorStop(0,'rgba(90,150,255,.32)');gr.addColorStop(.45,'rgba(45,100,230,.17)');gr.addColorStop(1,'rgba(10,30,110,0)');
  c.fillStyle=gr;c.fillRect(0,0,S,S);
  for(let i=0;i<15000;i++){
    const arm=i%2,rho=Math.pow(r(),.75);
    const th=arm*Math.PI+rho*7+(r()+r()+r()-1.5)*(0.55-rho*0.25);
    const x=cx+Math.cos(th)*rho*R,y=cy+Math.sin(th)*rho*R;
    const col=rho<.18?'255,236,196':rho<.45?'170,205,255':rho<.75?'95,150,255':'55,100,230';
    const a=(.16+r()*.6)*(rho<.18?.9:1),s=.6+r()*(rho<.3?1.2:1.8);
    c.fillStyle='rgba('+col+','+a.toFixed(2)+')';c.fillRect(x,y,s,s);
  }
  for(let i=0;i<140;i++){
    const arm=i%2,rho=.3+r()*.65,th=arm*Math.PI+rho*7+(r()-.5)*.25;
    const x=cx+Math.cos(th)*rho*R,y=cy+Math.sin(th)*rho*R,s=2+r()*4;
    const g=c.createRadialGradient(x,y,0,x,y,s*3);g.addColorStop(0,'rgba(150,200,255,.55)');g.addColorStop(1,'rgba(60,110,255,0)');
    c.fillStyle=g;c.fillRect(x-s*3,y-s*3,s*6,s*6);
  }
  c.globalCompositeOperation='source-over';
  for(let i=0;i<1100;i++){
    const arm=i%2,rho=.12+r()*.36,th=arm*Math.PI+rho*7+.3+(r()-.5)*.13;
    const x=cx+Math.cos(th)*rho*R,y=cy+Math.sin(th)*rho*R,s=2+r()*5;
    c.fillStyle='rgba(30,13,8,'+(.1+r()*.22).toFixed(2)+')';c.beginPath();c.arc(x,y,s,0,6.283);c.fill();
  }
  c.globalCompositeOperation='lighter';
  gr=c.createRadialGradient(cx,cy,0,cx,cy,R*.3);
  gr.addColorStop(0,'rgba(255,249,228,1)');gr.addColorStop(.1,'rgba(255,226,170,.75)');gr.addColorStop(.35,'rgba(150,190,255,.28)');gr.addColorStop(1,'rgba(40,80,200,0)');
  c.fillStyle=gr;c.beginPath();c.arc(cx,cy,R*.3,0,6.283);c.fill();
}
function paintStars(cv){
  const dpr=Math.min(window.devicePixelRatio||1,2),W=window.innerWidth||1200,H=window.innerHeight||800;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const c=cv.getContext('2d');c.scale(dpr,dpr);
  const r=rng(2025),n=Math.round(W*H/5000);
  for(let i=0;i<n;i++){
    const x=r()*W,y=r()*H,big=r()<.06,s=big?1.3+r()*1.3:.4+r()*.9,k=r();
    const col=k<.6?'255,255,255':k<.88?'255,222,170':'160,200,255',a=.35+r()*.65;
    if(big){const g=c.createRadialGradient(x,y,0,x,y,s*5);g.addColorStop(0,'rgba('+col+',.95)');g.addColorStop(.25,'rgba('+col+',.3)');g.addColorStop(1,'rgba('+col+',0)');c.fillStyle=g;c.fillRect(x-s*5,y-s*5,s*10,s*10);}
    c.fillStyle='rgba('+col+','+a.toFixed(2)+')';c.beginPath();c.arc(x,y,s,0,6.283);c.fill();
  }
}

function mazeSVG(L,marksOn){
  const {W,H,open,exit}=L.d,c=52,m=26,w=m+W*c+6,h=m+H*c+6;
  let s='<svg viewBox="0 0 '+w+' '+h+'" class="maze" role="img" aria-label="Карта минного поля">';
  s+='<rect class="bg" x="'+m+'" y="'+m+'" width="'+(W*c)+'" height="'+(H*c)+'" rx="4"/>';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    s+='<rect class="cm'+(marks['m'+x+'_'+y]?' on':'')+'" data-a="mark" data-k="m'+x+'_'+y+'" x="'+(m+x*c)+'" y="'+(m+y*c)+'" width="'+c+'" height="'+c+'"/>';
  }
  for(let x=0;x<W;x++)s+='<text x="'+(m+x*c+c/2)+'" y="17" text-anchor="middle">'+String.fromCharCode(65+x)+'</text>';
  for(let y=0;y<H;y++)s+='<text x="11" y="'+(m+y*c+c/2+4)+'" text-anchor="middle">'+(y+1)+'</text>';
  s+='<text class="star" x="'+(m+exit[0]*c+c/2)+'" y="'+(m+exit[1]*c+c/2+10)+'" text-anchor="middle">★</text>';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const X=m+x*c,Y=m+y*c,o=open[y][x];
    if(!o.n)s+='<line x1="'+X+'" y1="'+Y+'" x2="'+(X+c)+'" y2="'+Y+'"/>';
    if(!o.w)s+='<line x1="'+X+'" y1="'+Y+'" x2="'+X+'" y2="'+(Y+c)+'"/>';
    if(y===H-1&&!o.s)s+='<line x1="'+X+'" y1="'+(Y+c)+'" x2="'+(X+c)+'" y2="'+(Y+c)+'"/>';
    if(x===W-1&&!o.e)s+='<line x1="'+(X+c)+'" y1="'+Y+'" x2="'+(X+c)+'" y2="'+(Y+c)+'"/>';
  }
  return s+'</svg>';
}

    return '<p class="hint">Для запуска каждый из вас должен повернуть свой ключ в правильном порядке. У каждого только один кусочек инструкции. Ошибка сбрасывает последовательность и пробивает корпус.</p>'+
    '<div class="clue"><small>Твоя часть инструкции</small>'+clueText(D.clues[role])+'</div>'+
    '<div class="slots">'+slots+'</div>'+
    '<button class="big launch" data-a="launch">🔑 Повернуть ключ</button>';
  }
};
function panelHTML(role,V){
  const L=G.levels[V.st];
  const slot=L.A===role?'A':L.B===role?'B':'C';
  return shell(role,V,L,PANELS[L.t](slot,V,L,role));
}
function missingRoles(){
  if(solo||!room)return[];
  const h=holders();return RK.filter(r=>!h[r]);
}

/* ----- Игровой экран ----- */
const GAME_SHELL='<div id="scene"></div><div id="tabs"></div><div id="banner"></div><div id="panel"></div>';
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function showGame(V){
  if(screen!=='game'){main.innerHTML=GAME_SHELL;screen='game';lastSig='';lastScene='';}
  if(!G||G.seed!==V.seed)G=gen(V.seed);
  if(V.st>=G.levels.length)return;
  if(seenSeed!==V.seed){seenSeed=V.seed;lastEv=V.ev.n;lastPh=V.ph;lastSt=-1;}
  if(lastSt!==V.st){lastSt=V.st;lev=[0,0,0,0];marks={};typed='';}

  hud.hidden=false;
  const n=G.levels.length;
  $('#pips').innerHTML=G.levels.map((_,i)=>'<span class="pip '+(V.ph==='win'||i<V.st?'done':i===V.st?'cur':'')+'"></span>').join('');
  $('#hmod').textContent='Модуль '+Math.min(V.st+1,n)+' из '+n;
  const tm=$('#timer');tm.textContent=fmt(V.left);tm.className='timer'+(V.left<=60&&V.ph==='play'?' low':'');
  $('#hull').innerHTML=[0,1,2].map(i=>'<i class="'+(i<V.hull?'':'off')+'" title="Корпус"></i>').join('');
  $('#hroom').textContent=solo?'Тренировка':'Комната '+code;

  if(V.ev.n!==lastEv){
    lastEv=V.ev.n;
    if(V.ev.t){toast(V.ev.t,V.ev.k);sfx(V.ev.k);}
    if(V.ev.k==='bad'){hud.classList.remove('shake');void hud.offsetWidth;hud.classList.add('shake');}
  }

  const role=solo?soloRole:myRole,miss=missingRoles().join(',');
  const sig=[V.ph,V.st,JSON.stringify(V.x),role||'-',miss,V.hull].join('|');
  if(sig!==lastSig){lastSig=sig;renderPanel(V,role,miss);}

  const alertOn=V.ph==='play'&&V.left<=60;
  const ssig=[V.st,V.hull,V.ph,role||'-',miss,alertOn,Math.round(V.st/G.levels.length*10)].join('|');
  if(ssig!==lastScene){
    lastScene=ssig;
    const sc=$('#scene');
    if(sc)sc.innerHTML=sceneHTML({lit:litNow(),me:role,hull:V.hull,prog:V.ph==='win'?1:V.st/G.levels.length,phase:V.ph==='play'?'play':V.ph,alert:alertOn,levels:levelStrip(V)},'');
  }
  if(document.body)document.body.classList.toggle('alert',alertOn);
  if(V.ph!==lastPh||(V.ph!=='play'&&ov.hidden)){lastPh=V.ph;renderOverlay(V);}
  if(V.ph==='play'&&!ov.hidden)ov.hidden=true;
}
function renderPanel(V,role,miss){
  V=V||viewState();if(!V||!G)return;
  role=role===undefined?(solo?soloRole:myRole):role;
  const tabs=$('#tabs'),ban=$('#banner'),pan=$('#panel');if(!pan)return;
  tabs.innerHTML=solo?'<div class="tabs">'+RK.map(r=>'<button class="'+(soloRole===r?'on':'')+'" style="--ac:'+ROLES[r].c+'" data-a="tab" data-r="'+r+'">'+ROLES[r].ic+' '+ROLES[r].n+'</button>').join('')+'</div>':'';
  const m=miss===undefined?missingRoles().join(','):miss;
  ban.innerHTML=(!solo&&m)?'<div class="banner">⚠ Нет игрока на позиции: '+m.split(',').map(r=>ROLES[r].n).join(', ')+'. Без него миссию не пройти.</div>':'';
  if(!role){
    const h=holders();
    pan.innerHTML='<div class="card pad"><b>Игра уже идёт.</b><p class="hint" style="margin-top:6px">Вы наблюдатель. Если в команде освободился отсек, можно его занять:</p><div class="roles">'+
      RK.filter(r=>!h[r]).map(r=>'<button class="rolecard" style="--ac:'+ROLES[r].c+'" data-a="claim" data-r="'+r+'"><span class="ic">'+ROLES[r].ic+'</span><b>'+ROLES[r].n+'</b><small>'+ROLES[r].room+'</small></button>').join('')+'</div></div>';
    return;
  }
  const keep=document.activeElement&&document.activeElement.id==='wordin';
  try{pan.innerHTML=panelHTML(role,V);}
  catch(e){pan.innerHTML='<div class="card pad">Ошибка отображения панели.</div>';}
  if(keep){const w=$('#wordin');if(w){w.focus();try{w.setSelectionRange(w.value.length,w.value.length);}catch(e){}}}
}
function renderOverlay(V){
  if(V.ph==='play'){ov.hidden=true;return;}
  const win=V.ph==='win';
  const why=win?'Двигатели запущены, «Аврора-7» ушла из зоны аварии. Отличная работа команды.':
    (V.why==='time'?'Время вышло: реактор не выдержал.':'Корпус разгерметизирован: три пробоины.');
  const again=(solo||hosting)?'<button class="big" style="--ac:#ff9d3d" data-a="again">'+(solo?'В меню':'Сыграть ещё раз')+'</button>':'<p class="hint">Ждём, пока игрок, запустивший миссию, начнёт новую игру.</p>';
  ov.innerHTML='<div class="card box">'+sceneHTML({lit:{eng:1,nav:1,rad:1},hull:V.hull,prog:1,phase:win?'win':'lose',levels:null},'mini','o')+'<h2 style="color:'+(win?'var(--good)':'var(--bad)')+'">'+(win?'Корабль спасён':'Корабль потерян')+'</h2><p>'+why+'</p>'+
    '<div class="st"><span>⏱ '+fmt(V.left)+' в запасе</span><span>🛡 Пробоин: '+(3-V.hull)+'</span></div>'+again+'</div>';
  ov.hidden=false;sfx(win?'ok':'bad');
}

function render(){
  if(mode==='menu'){if(screen!=='menu')showMenu();return;}
  if(mode==='solo'){if(S)showGame(S);return;}
  if(!room)return;
  const V=viewState();
  if(!V||!okState(V)){
    if(screen==='game'){ov.hidden=true;lastSig='';}
    showLobby();return;
  }
  showGame(V);
}

/* ======================================================================
   События интерфейса
   ====================================================================== */
main.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  switch(a){
    case'online':goOnline();break;
    case'solo':solo=true;mode='solo';myRole=null;soloRole='eng';screen='';chat.hidden=true;startGame();break;
    case'leave':leaveRoom();break;
    case'claim':claim(b.dataset.r);break;
    case'start':if(solo||iAmCreator())startGame();else toast('Запустить миссию может только создатель комнаты','bad');break;
    case'lv':{const i=+b.dataset.i;lev[i]=(lev[i]+(+b.dataset.d)+10)%10;renderPanel(viewState());break;}
    case'mark':{const k=b.dataset.k;marks[k]=!marks[k];renderPanel(viewState());break;}
    case'apply':send({k:'apply',d:lev.slice()});break;
    case'mv':send({k:'mv',d:b.dataset.d});break;
    case'pick':send({k:'pick',w:b.dataset.w});break;
    case'cut':send({k:'cut',i:+b.dataset.i});break;
    case'dial':send({k:'dial',v:+b.dataset.v});break;
    case'check':send({k:'check'});break;
    case'gt':send({k:'gt',i:+b.dataset.i});break;
    case'gok':send({k:'gok'});break;
    case'word':{const w=typed;typed='';send({k:'word',w});renderPanel(viewState());break;}
    case'launch':send({k:'launch'});break;
    case'tab':soloRole=b.dataset.r;lastSig='';render();break;
  }
});
main.addEventListener('input',e=>{if(e.target&&e.target.id==='wordin')typed=e.target.value;});
main.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='wordin'){e.preventDefault();const w=typed;typed='';send({k:'word',w});renderPanel(viewState());}
});
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-a="again"]');if(!b)return;
  ov.hidden=true;lastPh='';backToLobby();
});
$('#csend').addEventListener('click',sendChat);
$('#cin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});

paintSpace();
showMenu();
})();
</script>
</body>
</html>
